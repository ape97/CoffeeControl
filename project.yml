name: CoffeeControl
options:
  bundleIdPrefix: io.github.ape97
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  CoffeeControl:
    type: application
    platform: macOS
    sources:
      - path: CoffeeControl
    info:
      path: CoffeeControl/Resources/Info.plist
      properties:
        CFBundleName: Coffee Control
        CFBundleDisplayName: Coffee Control
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 ape97
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ape97.coffeecontrol
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
